<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EFEBE0" />
  <title>melanie bossert</title>
  <meta name="description" content="A small living meadow. Each creature is a project — tap one and ask it anything." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%234E7A3A'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --paper: #EFEBE0;
      --ink: #1C1A16;
      --mute: #6E6A5E;
      --green: #4E7A3A;
      --green-light: #9BE15D;
      --neon: #47E0D6;
      --lilac: #D9B8E8;
      --sky: #A9C7EC;
      --peach: #F2B98F;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100dvh;
      min-height: 100vh;
      font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--paper);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #world {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #world.ready { opacity: 1; }

    .page {
      position: relative;
      min-height: 100dvh;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(1rem, env(safe-area-inset-top))
        max(1rem, env(safe-area-inset-right))
        max(1rem, env(safe-area-inset-bottom))
        max(1rem, env(safe-area-inset-left));
      pointer-events: none;
      z-index: 2;
    }
    .page > * { pointer-events: auto; }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    .mark-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .mark {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .mark .sep {
      display: inline-block;
      width: 0.4rem; height: 0.4rem;
      border-radius: 50%;
      background: var(--ink);
      margin: 0 0.5rem 0.1rem;
      vertical-align: middle;
    }
    .role-line {
      font-size: 0.78rem;
      color: var(--mute);
    }

    /* ─── murmur-style black chip ticker ─── */
    .ticker {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--ink);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      max-width: min(92vw, 520px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.5s ease;
      box-shadow: 0 4px 18px rgba(28, 26, 22, 0.25);
    }
    .ticker .eye {
      width: 0.45rem; height: 0.45rem;
      border-radius: 50%;
      background: var(--green-light);
      flex: 0 0 auto;
      animation: tickerPulse 2.2s ease-in-out infinite;
    }
    @keyframes tickerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .ticker.swap { opacity: 0; }

    .bottom {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .contact {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
      background: rgba(239, 235, 224, 0.75);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: background 0.18s ease;
    }
    .contact:hover, .contact:focus-visible { background: rgba(239, 235, 224, 0.95); }
    .contact .arrow { transition: transform 0.18s ease; }
    .contact:hover .arrow, .contact:focus-visible .arrow { transform: translate(2px, -2px); }
    .contact:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* ─── creature labels (murmur chip style) ─── */
    .creature-btn {
      position: fixed;
      transform: translate(-50%, 0);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--ink);
      border: 0;
      border-radius: 999px;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      z-index: 3;
      transition: opacity 0.4s ease, background 0.18s ease;
      white-space: nowrap;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(28, 26, 22, 0.25);
    }
    .creature-btn .dot {
      width: 0.4rem; height: 0.4rem;
      border-radius: 50%;
      background: var(--dot, var(--green-light));
      flex: 0 0 auto;
    }
    .creature-btn:hover { background: #2E2B25; }
    .creature-btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      opacity: 1 !important;
    }

    /* ─── sheet ─── */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 26, 22, 0.35);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 9;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 92dvh;
      max-height: 92dvh;
      background: var(--paper);
      border-radius: 24px 24px 0 0;
      transform: translateY(102%);
      transition: transform 0.45s cubic-bezier(.2,.85,.2,1);
      z-index: 10;
      box-shadow: 0 -20px 60px rgba(28,26,22,0.3);
      display: flex;
      flex-direction: column;
      padding: 1rem 1.25rem max(1rem, env(safe-area-inset-bottom));
      will-change: transform;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: rgba(28,26,22,0.18);
      border-radius: 999px;
      margin: 0 auto 0.75rem;
      flex: 0 0 auto;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex: 0 0 auto;
    }
    .sheet-id {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--mute);
      text-transform: uppercase;
    }
    .sheet-close {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 0;
      background: rgba(28, 26, 22, 0.06);
      color: var(--ink);
      font-size: 1.1rem;
      cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.18s ease;
      flex: 0 0 auto;
    }
    .sheet-close:hover, .sheet-close:focus-visible { background: rgba(28, 26, 22, 0.12); outline: none; }

    .sheet-hero {
      margin: 0.75rem 0 1rem;
      width: 100%;
      aspect-ratio: 21 / 9;
      border-radius: 16px;
      background: radial-gradient(circle at 30% 35%, rgba(255,255,255,0.5), transparent 60%), var(--hero-color, var(--lilac));
      flex: 0 0 auto;
      overflow: hidden;
    }
    .sheet-title {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: clamp(1.8rem, 6.5vw, 2.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
      color: var(--ink);
      flex: 0 0 auto;
    }
    .sheet-role {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--green);
      margin: 0 0 0.5rem;
      flex: 0 0 auto;
    }
    .sheet-summary {
      font-size: 0.95rem;
      color: var(--mute);
      margin: 0 0 0.85rem;
      max-width: 60ch;
      flex: 0 0 auto;
    }

    /* ─── chat ─── */
    .chat {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-top: 1px solid rgba(28,26,22,0.08);
      padding-top: 0.85rem;
      gap: 0.75rem;
    }
    .conversation {
      flex: 1 1 auto;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0 0.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 92%;
      padding: 0.65rem 0.85rem;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg.bot {
      background: rgba(28, 26, 22, 0.05);
      color: var(--ink);
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }
    .msg.user {
      background: var(--ink);
      color: var(--paper);
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }
    .msg.intro {
      background: transparent;
      color: var(--mute);
      padding: 0.25rem 0.3rem;
      font-size: 0.85rem;
      font-style: italic;
      max-width: 100%;
    }
    .msg.typing {
      display: inline-flex;
      gap: 0.3rem;
      align-items: center;
      background: rgba(28, 26, 22, 0.05);
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }
    .msg.typing i {
      width: 0.35rem; height: 0.35rem;
      border-radius: 50%;
      background: var(--mute);
      animation: typing 1.1s ease-in-out infinite;
    }
    .msg.typing i:nth-child(2) { animation-delay: 0.15s; }
    .msg.typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-3px); opacity: 1; }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0 0.2rem;
      flex: 0 0 auto;
    }
    .chip {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink);
      background: rgba(28, 26, 22, 0.05);
      border: 1px solid rgba(28, 26, 22, 0.08);
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s, transform 0.18s;
      white-space: nowrap;
      min-height: 40px;
    }
    .chip::before { content: '+ '; opacity: 0.55; }
    .chip:hover, .chip:focus-visible {
      background: rgba(28, 26, 22, 0.1);
      transform: translateY(-1px);
      outline: none;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 0 0 auto;
      background: rgba(28, 26, 22, 0.05);
      border-radius: 999px;
      padding: 0.35rem 0.35rem 0.35rem 1rem;
    }
    .composer input {
      flex: 1 1 auto;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      padding: 0.5rem 0;
      outline: none;
      min-width: 0;
    }
    .composer input::placeholder { color: var(--mute); }
    .composer button {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 0;
      background: var(--ink);
      color: var(--paper);
      font-size: 1rem;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.18s ease;
      flex: 0 0 auto;
    }
    .composer button:hover { transform: scale(1.05); }

    @media (min-width: 768px) {
      .page {
        padding: max(1.5rem, env(safe-area-inset-top))
                 max(2rem, env(safe-area-inset-right))
                 max(1.5rem, env(safe-area-inset-bottom))
                 max(2rem, env(safe-area-inset-left));
      }
      .mark { font-size: 1.2rem; }
      .role-line { font-size: 0.85rem; }
      .ticker { font-size: 0.74rem; }
      .sheet {
        left: 50%;
        right: auto;
        bottom: 4vh;
        width: min(560px, 90vw);
        height: 86vh;
        transform: translateX(-50%) translateY(110%);
        border-radius: 28px;
        padding: 1.25rem 1.5rem 1.25rem;
      }
      .sheet.open { transform: translateX(-50%) translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker .eye { animation: none; }
      .msg.typing i { animation: none; }
      .sheet, .backdrop, .creature-btn, #world { transition: none !important; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .top    { animation: rise 0.7s 0.15s cubic-bezier(.2,.8,.2,1) both; }
    .bottom { animation: rise 0.7s 0.45s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .top, .bottom { animation: none; }
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>

  </script>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>

  <div class="page">
    <header class="top">
      <div class="mark-row">
        <span class="mark"><em>m.</em><span class="sep"></span><em>bossert</em></span>
        <span class="role-line">a small ecosystem of projects</span>
      </div>
      <p class="ticker" id="ticker"><span class="eye"></span><span id="tickerText">the meadow is waking up…</span></p>
    </header>

    <div></div>

    <footer class="bottom">
      <a class="contact" href="mailto:mnbossert@gmail.com">
        mnbossert@gmail.com<span class="arrow" aria-hidden="true">&nbsp;↗</span>
      </a>
    </footer>
  </div>

  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="sheet-head">
      <span class="sheet-id" id="sheetId">project</span>
      <button class="sheet-close" id="sheetClose" aria-label="Close project">×</button>
    </div>
    <div class="sheet-hero" id="sheetHero"></div>
    <h2 class="sheet-title" id="sheetTitle">Project</h2>
    <p class="sheet-role" id="sheetRole"></p>
    <p class="sheet-summary" id="sheetSummary"></p>

    <section class="chat" aria-label="Ask about this project">
      <ol class="conversation" id="conv" aria-live="polite"></ol>
      <div class="chips" id="chips" role="group" aria-label="Suggested topics"></div>
      <form class="composer" id="composer" autocomplete="off">
        <label for="composerInput" class="sr-only">Ask about this project</label>
        <input id="composerInput" type="text" placeholder="ask about this project…" />
        <button type="submit" aria-label="Send">↗</button>
      </form>
    </section>
  </aside>

  <!-- ─── project data (EDIT ME) ──────────────────────────────────
       species: "jelly" (floats + pulses) | "moth" (flies in loops) | "crawler" (ambles the meadow)
       role: your role — shown under the title and askable in chat.
       ────────────────────────────────────────────────────────────── -->
  <script type="application/json" id="projects-data">
  [
    {
      "id": "p1",
      "label": "untitled · 01",
      "species": "jelly",
      "color": "#D9B8E8",
      "role": "role — concept & design",
      "summary": "A placeholder for your first project. Replace this data block at the bottom of index.html.",
      "topics": [
        { "id": "what",    "label": "what is it",   "answer": "A placeholder. Replace me with a real description of what this project is.", "related": ["role", "why"] },
        { "id": "role",    "label": "my role",      "answer": "Describe what YOU did: concept? design? code? research? leading? Replace me.", "related": ["process", "team"] },
        { "id": "why",     "label": "why",          "answer": "The reason this project mattered to you.", "related": ["role"] },
        { "id": "team",    "label": "the team",     "answer": "Who else was involved, and how you worked together.", "related": ["role"] },
        { "id": "process", "label": "process",      "answer": "How you actually made it, in your own words.", "related": ["tools", "lessons"] },
        { "id": "tools",   "label": "stack",        "answer": "Tools, languages, materials.", "related": ["process"] },
        { "id": "lessons", "label": "what I learned", "answer": "One or two things that stayed with you.", "related": ["why"] }
      ]
    },
    {
      "id": "p2",
      "label": "untitled · 02",
      "species": "moth",
      "color": "#A9C7EC",
      "role": "role — tbd",
      "summary": "Second project placeholder. Each creature carries its own chat.",
      "topics": [
        { "id": "what",    "label": "what is it",   "answer": "Describe project two.", "related": ["role"] },
        { "id": "role",    "label": "my role",      "answer": "What you did on this one.", "related": ["process"] },
        { "id": "process", "label": "how it was made", "answer": "Step by step, your way.", "related": ["tools"] },
        { "id": "tools",   "label": "stack",        "answer": "Tools and materials.", "related": ["result"] },
        { "id": "result",  "label": "outcome",      "answer": "How it landed when released.", "related": ["role"] }
      ]
    },
    {
      "id": "p3",
      "label": "untitled · 03",
      "species": "crawler",
      "color": "#F2B98F",
      "role": "role — tbd",
      "summary": "Third placeholder. Add more projects and more creatures appear in the meadow.",
      "topics": [
        { "id": "what",        "label": "what is it",  "answer": "Describe project three.", "related": ["role"] },
        { "id": "role",        "label": "my role",     "answer": "Your part in it.", "related": ["inspiration"] },
        { "id": "inspiration", "label": "inspiration", "answer": "Where the spark came from.", "related": ["process"] },
        { "id": "process",     "label": "process",     "answer": "Idea to thing.", "related": ["lessons"] },
        { "id": "lessons",     "label": "what I learned", "answer": "What stays with you.", "related": ["role"] }
      ]
    }
  ]
  </script>

  <script type="module">
    import * as THREE from 'three';

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const projects = JSON.parse(document.getElementById('projects-data').textContent);
    const isMobile = Math.min(innerWidth, innerHeight) < 700;

    /* ═══════════════ renderer / scene / camera ═══════════════ */
    const canvas = document.getElementById('world');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);

    const PAPER = new THREE.Color('#EFEBE0');
    const scene = new THREE.Scene();
    scene.background = PAPER;
    scene.fog = new THREE.Fog(PAPER, 10, 26);

    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 60);
    const camBase = new THREE.Vector3(0, 3.0, 9.5);
    camera.position.copy(camBase);
    const lookAt = new THREE.Vector3(0, 0.8, 0);
    camera.lookAt(lookAt);

    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    /* ═══════════════ shared uniforms ═══════════════ */
    const uTime = { value: 0 };
    const uPointer = { value: new THREE.Vector3(999, 0, 999) }; // world-space on ground

    /* ═══════════════ ground ═══════════════ */
    const groundGeo = new THREE.CircleGeometry(22, 64);
    groundGeo.rotateX(-Math.PI / 2);
    {
      // painterly vertex colors: green with brown patches
      const pos = groundGeo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const g1 = new THREE.Color('#6B9A4C'), g2 = new THREE.Color('#557F3D'), br = new THREE.Color('#7A6248');
      const c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const n = Math.sin(x * 0.35 + 1.7) * Math.cos(z * 0.42) + Math.sin(x * 0.13) * 0.6;
        c.copy(g1).lerp(g2, Math.min(Math.max(n * 0.5 + 0.5, 0), 1));
        if (n > 0.75) c.lerp(br, (n - 0.75) * 1.6);
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
      }
      groundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    }
    const ground = new THREE.Mesh(groundGeo, new THREE.MeshBasicMaterial({ vertexColors: true, fog: true }));
    scene.add(ground);

    /* ═══════════════ instanced grass ═══════════════ */
    const BLADES = isMobile ? 14000 : 26000;
    const bladeBase = new THREE.BufferGeometry();
    bladeBase.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      -0.035, 0, 0,   0.035, 0, 0,   0, 1, 0
    ]), 3));
    bladeBase.setAttribute('aY', new THREE.BufferAttribute(new Float32Array([0, 0, 1]), 1));

    const grassGeo = new THREE.InstancedBufferGeometry();
    grassGeo.index = null;
    grassGeo.attributes.position = bladeBase.attributes.position;
    grassGeo.attributes.aY = bladeBase.attributes.aY;
    grassGeo.instanceCount = BLADES;

    const offsets = new Float32Array(BLADES * 3);
    const scales = new Float32Array(BLADES);
    const hues = new Float32Array(BLADES);
    const phases = new Float32Array(BLADES);
    for (let i = 0; i < BLADES; i++) {
      // scatter in an ellipse, denser near center
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random());
      offsets[i * 3]     = Math.cos(a) * r * 13;
      offsets[i * 3 + 1] = 0;
      offsets[i * 3 + 2] = Math.sin(a) * r * 8 - 0.5;
      scales[i] = 0.25 + Math.random() * 0.3;
      hues[i]   = Math.random();
      phases[i] = Math.random() * Math.PI * 2;
    }
    grassGeo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(offsets, 3));
    grassGeo.setAttribute('aScale',  new THREE.InstancedBufferAttribute(scales, 1));
    grassGeo.setAttribute('aHue',    new THREE.InstancedBufferAttribute(hues, 1));
    grassGeo.setAttribute('aPhase',  new THREE.InstancedBufferAttribute(phases, 1));

    const grassMat = new THREE.ShaderMaterial({
      uniforms: { uTime, uPointer, fogColor: { value: PAPER }, fogNear: { value: 10 }, fogFar: { value: 26 } },
      side: THREE.DoubleSide,
      vertexShader: /* glsl */`
        attribute vec3 aOffset;
        attribute float aScale, aHue, aPhase, aY;
        uniform float uTime;
        uniform vec3 uPointer;
        varying float vY, vHue, vFogDepth;
        void main() {
          vY = aY; vHue = aHue;
          vec3 p = position * aScale;
          p.y *= (1.0 + aScale);
          // wind: bend grows with height squared
          float sway = sin(uTime * 1.6 + aPhase + aOffset.x * 0.4) * 0.14
                     + sin(uTime * 3.7 + aPhase * 2.0) * 0.04;
          p.x += sway * aY * aY;
          // pointer push: blades lean away from the visitor's touch
          vec2 d = aOffset.xz - uPointer.xz;
          float dist = length(d);
          if (dist < 1.6) {
            p.xz += normalize(d) * (1.0 - dist / 1.6) * 0.35 * aY;
          }
          vec4 mv = modelViewMatrix * vec4(p + aOffset, 1.0);
          vFogDepth = -mv.z;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: /* glsl */`
        varying float vY, vHue, vFogDepth;
        uniform vec3 fogColor;
        uniform float fogNear, fogFar;
        void main() {
          vec3 root = vec3(0.184, 0.325, 0.149);          // #2F5326
          vec3 tipA = vec3(0.561, 0.710, 0.384);          // #8FB562
          vec3 tipB = vec3(0.780, 0.882, 0.365);          // lighter, yellower
          vec3 tip = mix(tipA, tipB, vHue);
          vec3 col = mix(root, tip, vY);
          float fogF = smoothstep(fogNear, fogFar, vFogDepth);
          gl_FragColor = vec4(mix(col, fogColor, fogF), 1.0);
        }
      `,
    });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.frustumCulled = false;
    scene.add(grass);

    /* ═══════════════ ramp-lit creature material ═══════════════ */
    function rampMaterial(hex, doubleSide = false) {
      const c = new THREE.Color(hex);
      const shadow = c.clone().multiplyScalar(0.55).lerp(new THREE.Color('#2F5326'), 0.25);
      return new THREE.ShaderMaterial({
        side: doubleSide ? THREE.DoubleSide : THREE.FrontSide,
        uniforms: {
          uLit: { value: c },
          uShadow: { value: shadow },
          uRim: { value: new THREE.Color('#FFF6D8') },
          fogColor: { value: PAPER }, fogNear: { value: 10 }, fogFar: { value: 26 },
        },
        vertexShader: /* glsl */`
          varying vec3 vN, vV;
          varying float vFogDepth;
          void main() {
            vN = normalize(normalMatrix * normal);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vV = normalize(-mv.xyz);
            vFogDepth = -mv.z;
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: /* glsl */`
          uniform vec3 uLit, uShadow, uRim, fogColor;
          uniform float fogNear, fogFar;
          varying vec3 vN, vV;
          varying float vFogDepth;
          void main() {
            vec3 L = normalize(vec3(0.5, 0.9, 0.4));
            float ndl = dot(vN, L) * 0.5 + 0.5;
            vec3 col = mix(uShadow, uLit, smoothstep(0.25, 0.85, ndl));
            float rim = pow(1.0 - max(dot(vN, vV), 0.0), 3.0);
            col += uRim * rim * 0.35;
            float fogF = smoothstep(fogNear, fogFar, vFogDepth);
            gl_FragColor = vec4(mix(col, fogColor, fogF), 1.0);
          }
        `,
      });
    }

    /* ═══════════════ creatures ═══════════════ */
    function noise1(t, p) {
      return Math.sin(t * 0.7 + p) * 0.5 + Math.sin(t * 1.7 + p * 2.1) * 0.35 + Math.sin(t * 3.1 + p * 0.7) * 0.15;
    }

    class Creature {
      constructor(proj, index, count) {
        this.proj = proj;
        this.species = proj.species || 'jelly';
        this.seed = index * 137.5;
        this.group = new THREE.Group();
        const fx = (index + 0.5) / count;
        this.homeX = -3.2 + fx * 6.4;
        this.homeZ = (index % 2 === 0) ? 1.4 : -0.3;
        this.x = this.homeX; this.z = this.homeZ;
        this.vx = 0; this.vz = 0;
        this.heading = Math.random() * Math.PI * 2;
        this.nearPointer = 0;
        this.baseY = this.species === 'moth' ? 1.45 : this.species === 'jelly' ? 1.15 : 0.18;
        this.build();
        scene.add(this.group);
      }

      build() {
        const mat = rampMaterial(this.proj.color);
        this.mat = mat;
        if (this.species === 'jelly') {
          this.body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 20), mat);
          this.body.scale.y = 0.8;
          this.group.add(this.body);
          // tentacles
          this.tentacles = [];
          const tMat = new THREE.LineBasicMaterial({ color: new THREE.Color(this.proj.color).multiplyScalar(0.8), fog: true });
          for (let i = 0; i < 5; i++) {
            const pts = Array.from({ length: 6 }, (_, k) => new THREE.Vector3(0, -k * 0.13, 0));
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), tMat);
            line.position.set((i - 2) * 0.13, -0.25, 0);
            this.group.add(line);
            this.tentacles.push(line);
          }
        } else if (this.species === 'moth') {
          this.body = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.3, 4, 8), rampMaterial('#1C1A16'));
          this.body.rotation.x = Math.PI / 2;
          this.group.add(this.body);
          this.wings = [];
          const wingMat = rampMaterial(this.proj.color, true);
          const wingGeo = new THREE.CircleGeometry(0.34, 20);
          wingGeo.rotateX(-Math.PI / 2);
          wingGeo.translate(0.3, 0, 0);
          for (const side of [-1, 1]) {
            const w = new THREE.Mesh(wingGeo, wingMat);
            w.scale.x = side;
            this.group.add(w);
            this.wings.push(w);
          }
        } else {
          this.body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 22, 18), mat);
          this.body.scale.set(1.15, 0.72, 0.9);
          this.group.add(this.body);
          const shell = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.055, 8, 20), rampMaterial('#B98A66'));
          shell.position.set(0.05, 0.28, 0);
          this.group.add(shell);
        }
        // invisible tap proxy (generous)
        this.proxy = new THREE.Mesh(
          new THREE.SphereGeometry(0.85, 8, 6),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        this.proxy.userData.creature = this;
        this.group.add(this.proxy);
      }

      update(t, dt) {
        const s = this.seed;
        const speedBase = this.species === 'moth' ? 0.9 : this.species === 'jelly' ? 0.5 : 0.3;

        this.heading += noise1(t * 0.4, s) * 0.8 * dt;
        this.vx += (this.homeX - this.x) * 0.12 * dt;
        this.vz += (this.homeZ - this.z) * 0.12 * dt;

        // separation
        for (const other of creatures) {
          if (other === this) continue;
          const dx = this.x - other.x, dz = this.z - other.z;
          const d = Math.hypot(dx, dz) || 0.001;
          if (d < 2.2) {
            const push = (1 - d / 2.2) * 1.6;
            this.vx += (dx / d) * push * dt;
            this.vz += (dz / d) * push * dt;
          }
        }

        // curiosity toward pointer on ground
        const dp = Math.hypot(uPointer.value.x - this.x, uPointer.value.z - this.z);
        const near = dp < 2.5 ? 1 - dp / 2.5 : 0;
        this.nearPointer += (near - this.nearPointer) * (1 - Math.exp(-5 * dt));
        const speed = speedBase * (1 - this.nearPointer * 0.6);
        if (near > 0) {
          this.vx += (uPointer.value.x - this.x) * 0.25 * near * dt;
          this.vz += (uPointer.value.z - this.z) * 0.25 * near * dt;
        }

        this.vx += Math.cos(this.heading) * speed * dt;
        this.vz += Math.sin(this.heading) * speed * dt;
        this.vx *= Math.exp(-1.4 * dt);
        this.vz *= Math.exp(-1.4 * dt);
        this.x += this.vx;
        this.z += this.vz;
        // stay in the visible meadow band
        this.x = Math.max(-4.2, Math.min(4.2, this.x));
        this.z = Math.max(-2.2, Math.min(2.6, this.z));

        // species motion
        let y = this.baseY;
        if (this.species === 'jelly') {
          y += Math.sin(t * 1.1 + s) * 0.15;
          const pulse = 1 + Math.sin(t * 1.8 + s) * 0.05 + this.nearPointer * 0.06;
          this.body.scale.set(pulse, 0.8 * (2 - pulse), pulse);
          this.tentacles.forEach((line, i) => {
            line.rotation.z = Math.sin(t * 2.0 + i + s) * 0.25;
          });
        } else if (this.species === 'moth') {
          y += Math.sin(t * 2.3 + s) * 0.25 + Math.sin(t * 0.7 + s * 2.0) * 0.15;
          const flap = Math.sin(t * (reduce ? 2 : 14) + s) * 0.9;
          this.wings[0].rotation.z =  flap * 0.55 + 0.15;
          this.wings[1].rotation.z = -flap * 0.55 - 0.15;
          this.group.rotation.y = -this.heading + Math.PI / 2;
        } else {
          const amble = Math.sin(t * 2.6 + s);
          this.body.scale.set(1.15 + amble * 0.04, 0.72 - amble * 0.03, 0.9);
        }

        this.group.position.set(this.x, y, this.z);
      }
    }

    const creatures = projects.map((p, i) => new Creature(p, i, projects.length));

    /* ═══════════════ neon wireframe accents (murmur nod) ═══════════════ */
    const wireMat = new THREE.LineBasicMaterial({ color: '#47E0D6', transparent: true, opacity: 0.85 });
    const wires = [];
    for (let i = 0; i < 2; i++) {
      const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.45, 0.45, 0.45)), wireMat);
      box.position.set(i === 0 ? -3.2 : 3.6, 1.5 + i * 0.5, -2.2);
      scene.add(box);
      wires.push(box);
    }

    /* ═══════════════ drifting motes ═══════════════ */
    const MOTES = 90;
    const motePos = new Float32Array(MOTES * 3);
    for (let i = 0; i < MOTES; i++) {
      motePos[i * 3] = (Math.random() - 0.5) * 20;
      motePos[i * 3 + 1] = Math.random() * 3.5;
      motePos[i * 3 + 2] = (Math.random() - 0.5) * 12;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
      color: '#FFF6D8', size: 0.045, transparent: true, opacity: 0.8, fog: true,
    }));
    scene.add(motes);

    /* ═══════════════ pointer → world ═══════════════ */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hit = new THREE.Vector3();
    const pointerTarget = new THREE.Vector3(999, 0, 999);
    const parallax = { x: 0, y: 0 };

    function updatePointer(clientX, clientY) {
      ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(groundPlane, hit)) pointerTarget.copy(hit);
      parallax.x = ndc.x;
      parallax.y = ndc.y;
    }
    addEventListener('pointermove', e => updatePointer(e.clientX, e.clientY), { passive: true });

    canvas.addEventListener('pointerdown', e => {
      updatePointer(e.clientX, e.clientY);
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(creatures.map(c => c.proxy));
      if (hits.length) openSheet(hits[0].object.userData.creature.proj);
    });

    /* ═══════════════ creature label buttons ═══════════════ */
    const buttons = creatures.map(c => {
      const b = document.createElement('button');
      b.className = 'creature-btn';
      b.style.setProperty('--dot', c.proj.color);
      b.innerHTML = `<span class="dot"></span>${c.proj.label} · talk`;
      b.setAttribute('aria-label', `Open project: ${c.proj.label}`);
      b.addEventListener('click', () => openSheet(c.proj));
      document.body.appendChild(b);
      return b;
    });
    const _v = new THREE.Vector3();
    function updateButtons() {
      creatures.forEach((c, i) => {
        _v.set(c.x, 0, c.z).project(camera);
        const sx = Math.max(80, Math.min(innerWidth - 80, (_v.x * 0.5 + 0.5) * innerWidth));
        const sy = (-_v.y * 0.5 + 0.5) * innerHeight;
        const b = buttons[i];
        b.style.left = sx + 'px';
        b.style.top = (sy + 8) + 'px';
        b.style.opacity = _v.z < 1 ? (0.75 + c.nearPointer * 0.25) : 0;
      });
    }

    /* ═══════════════ ambient ticker ═══════════════ */
    const tickerText = document.getElementById('tickerText');
    const ticker = document.getElementById('ticker');
    const verbs = {
      jelly:   ['is drifting over the grass', 'is pulsing quietly', 'is hovering nearby'],
      moth:    ['is circling the meadow', 'is dancing in the light', 'is fluttering past'],
      crawler: ['is taking its time', 'is ambling through the blades', 'is leaving a trail'],
    };
    function tickerMessage() {
      const c = creatures[Math.floor(Math.random() * creatures.length)];
      const v = verbs[c.species] || verbs.jelly;
      const verb = v[Math.floor(Math.random() * v.length)];
      const topics = c.proj.topics || [];
      const topic = topics[Math.floor(Math.random() * topics.length)];
      return `${c.proj.label} ${verb} · ask it about ${topic ? topic.label : 'itself'}`;
    }
    setInterval(() => {
      ticker.classList.add('swap');
      setTimeout(() => {
        tickerText.textContent = tickerMessage();
        ticker.classList.remove('swap');
      }, 500);
    }, 5000);
    setTimeout(() => { tickerText.textContent = tickerMessage(); }, 2200);

    /* ═══════════════ main loop ═══════════════ */
    let last = performance.now();
    let running = true;
    let revealed = false;

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (!reduce) uTime.value = now / 1000;
      const t = uTime.value;

      // eased world pointer (feel) — target updates instantly (responsiveness)
      uPointer.value.lerp(pointerTarget, 1 - Math.exp(-8 * dt));

      // camera parallax, damped
      camera.position.x += (camBase.x + parallax.x * 0.6 - camera.position.x) * (1 - Math.exp(-3 * dt));
      camera.position.y += (camBase.y - parallax.y * 0.3 - camera.position.y) * (1 - Math.exp(-3 * dt));
      camera.lookAt(lookAt);

      for (const c of creatures) c.update(t, dt);

      wires.forEach((w, i) => {
        w.rotation.x = t * 0.3 * (i ? 1 : -1);
        w.rotation.y = t * 0.4;
        w.position.y += Math.sin(t * 0.8 + i * 2) * 0.0015;
      });

      motes.rotation.y = t * 0.01;

      renderer.render(scene, camera);
      updateButtons();

      if (!revealed) {
        revealed = true;
        canvas.classList.add('ready');
      }
      if (running && !reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    if (reduce) {
      uTime.value = 4;
      setTimeout(() => frame(performance.now()), 100);
    }

    document.addEventListener('visibilitychange', () => {
      running = !document.hidden;
      if (running && !reduce) { last = performance.now(); requestAnimationFrame(frame); }
    });

    /* ═══════════════ sheet + chat ═══════════════ */
    const sheet = document.getElementById('sheet');
    const backdrop = document.getElementById('backdrop');
    const sheetId = document.getElementById('sheetId');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetRole = document.getElementById('sheetRole');
    const sheetSummary = document.getElementById('sheetSummary');
    const sheetHero = document.getElementById('sheetHero');
    const sheetClose = document.getElementById('sheetClose');
    const conv = document.getElementById('conv');
    const chipsEl = document.getElementById('chips');
    const composer = document.getElementById('composer');
    const composerInput = document.getElementById('composerInput');

    let activeProject = null;
    let askedTopicIds = new Set();
    let lastFocused = null;
    const conversations = new Map();

    function openSheet(proj) {
      activeProject = proj;
      lastFocused = document.activeElement;
      askedTopicIds = (conversations.get(proj.id)?.asked) || new Set();

      sheetId.textContent = proj.id + ' · ' + proj.label;
      sheetTitle.textContent = proj.label;
      sheetRole.textContent = proj.role || '';
      sheetSummary.textContent = proj.summary || '';
      sheetHero.style.setProperty('--hero-color', proj.color || 'var(--lilac)');

      conv.innerHTML = '';
      const existing = conversations.get(proj.id);
      if (existing && existing.messages.length) {
        existing.messages.forEach(m => appendMsg(m.role, m.text, false));
      } else {
        appendMsg('intro', 'ask anything about this project — or pick a topic.', false);
        conversations.set(proj.id, { messages: [{ role: 'intro', text: 'ask anything about this project — or pick a topic.' }], asked: new Set() });
        askedTopicIds = conversations.get(proj.id).asked;
      }
      renderChips(suggestedTopics(proj));
      composerInput.value = '';

      backdrop.classList.add('open');
      sheet.classList.add('open');
      backdrop.setAttribute('aria-hidden', 'false');
      setTimeout(() => sheet.focus({ preventScroll: true }), 380);
    }

    function closeSheet() {
      sheet.classList.remove('open');
      backdrop.classList.remove('open');
      backdrop.setAttribute('aria-hidden', 'true');
      activeProject = null;
      if (lastFocused && lastFocused.focus) lastFocused.focus({ preventScroll: true });
    }
    sheetClose.addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);
    addEventListener('keydown', e => {
      if (!sheet.classList.contains('open')) return;
      if (e.key === 'Escape') { closeSheet(); return; }
      if (e.key === 'Tab') {
        const focusables = sheet.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])');
        if (!focusables.length) return;
        const first = focusables[0], lastF = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastF.focus(); }
        else if (!e.shiftKey && document.activeElement === lastF) { e.preventDefault(); first.focus(); }
      }
    });

    function appendMsg(role, text, save = true) {
      const li = document.createElement('li');
      li.className = 'msg ' + role;
      li.textContent = text;
      conv.appendChild(li);
      conv.scrollTop = conv.scrollHeight;
      if (save && activeProject) conversations.get(activeProject.id).messages.push({ role, text });
      return li;
    }

    function showTyping() {
      const li = document.createElement('li');
      li.className = 'msg typing';
      li.innerHTML = '<i></i><i></i><i></i>';
      li.setAttribute('aria-hidden', 'true');
      conv.appendChild(li);
      conv.scrollTop = conv.scrollHeight;
      return li;
    }

    function suggestedTopics(proj, fromTopic = null) {
      const topics = proj.topics || [];
      let pool;
      if (fromTopic && fromTopic.related?.length) {
        pool = fromTopic.related.map(id => topics.find(t => t.id === id)).filter(Boolean);
      } else {
        pool = topics.slice();
      }
      const unasked = pool.filter(t => !askedTopicIds.has(t.id));
      return (unasked.length ? unasked : pool).slice(0, 5);
    }

    function renderChips(topics) {
      chipsEl.innerHTML = '';
      topics.forEach(t => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = t.label;
        b.addEventListener('click', () => askTopic(t));
        chipsEl.appendChild(b);
      });
    }

    function reply(topic) {
      const typing = showTyping();
      setTimeout(() => {
        typing.remove();
        appendMsg('bot', topic.answer);
        renderChips(suggestedTopics(activeProject, topic));
      }, 550 + Math.random() * 350);
    }

    function askTopic(topic) {
      if (!activeProject) return;
      appendMsg('user', topic.label);
      askedTopicIds.add(topic.id);
      reply(topic);
    }

    /* keyword matcher — swap for a real LLM endpoint later */
    function findBestTopic(query, proj) {
      const tokens = (query || '').toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(w => w.length > 2);
      if (!tokens.length) return null;
      let best = null, bestScore = 0;
      for (const t of proj.topics) {
        const target = (t.label + ' ' + (t.answer || '')).toLowerCase();
        const score = tokens.filter(tok => target.includes(tok)).length / tokens.length;
        if (score > bestScore) { best = t; bestScore = score; }
      }
      return bestScore >= 0.34 ? best : null;
    }

    composer.addEventListener('submit', e => {
      e.preventDefault();
      const q = composerInput.value.trim();
      if (!q || !activeProject) return;
      composerInput.value = '';
      appendMsg('user', q);
      const match = findBestTopic(q, activeProject);
      const typing = showTyping();
      setTimeout(() => {
        typing.remove();
        if (match) {
          askedTopicIds.add(match.id);
          appendMsg('bot', match.answer);
          renderChips(suggestedTopics(activeProject, match));
        } else {
          appendMsg('bot', "I don't have an answer for that yet — try one of these:");
          renderChips(suggestedTopics(activeProject));
        }
      }, 600 + Math.random() * 400);
    });
  </script>
</body>
</html>
