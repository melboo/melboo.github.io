<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EFEBE0" />
  <title>melanie bossert</title>
  <meta name="description" content="An alpine ecosystem of projects. Each creature is a piece of work — tap one and ask it anything." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 13 L6 4 L9 9 L11 6 L15 13 Z' fill='%235C7A54'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --paper: #EFEBE0;
      --ink: #1C1A16;
      --mute: #6E6A5E;
      --pine: #3E5C46;
      --meadow: #5C7A54;
      --lake: #5FB3AE;
      --granite: #8B8680;
      --snow: #F4F3EE;
      --sun: #E8B94C;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100dvh;
      min-height: 100vh;
      font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--paper);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #world {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #world.ready { opacity: 1; }

    .page {
      position: relative;
      min-height: 100dvh;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(1rem, env(safe-area-inset-top))
        max(1rem, env(safe-area-inset-right))
        max(1rem, env(safe-area-inset-bottom))
        max(1rem, env(safe-area-inset-left));
      pointer-events: none;
      z-index: 2;
    }
    .page > * { pointer-events: auto; }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    .mark-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    .mark {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .mark .sep {
      display: inline-block;
      width: 0.4rem; height: 0.4rem;
      border-radius: 50%;
      background: var(--ink);
      margin: 0 0.5rem 0.1rem;
      vertical-align: middle;
    }
    .role-line {
      font-size: 0.78rem;
      color: var(--mute);
      text-align: right;
    }

    .ticker {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--ink);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      max-width: min(92vw, 520px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.5s ease;
      box-shadow: 0 4px 18px rgba(28, 26, 22, 0.25);
    }
    .ticker .eye {
      width: 0.45rem; height: 0.45rem;
      border-radius: 50%;
      background: var(--sun);
      flex: 0 0 auto;
      animation: tickerPulse 2.2s ease-in-out infinite;
    }
    @keyframes tickerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .ticker.swap { opacity: 0; }

    .bottom {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .contact {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
      background: rgba(239, 235, 224, 0.75);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: background 0.18s ease;
    }
    .contact:hover, .contact:focus-visible { background: rgba(239, 235, 224, 0.95); }
    .contact .arrow { transition: transform 0.18s ease; }
    .contact:hover .arrow, .contact:focus-visible .arrow { transform: translate(2px, -2px); }
    .contact:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    .creature-btn {
      position: fixed;
      transform: translate(-50%, 0);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--ink);
      border: 0;
      border-radius: 999px;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      z-index: 3;
      transition: opacity 0.4s ease, background 0.18s ease;
      white-space: nowrap;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(28, 26, 22, 0.25);
    }
    .creature-btn .dot {
      width: 0.4rem; height: 0.4rem;
      border-radius: 50%;
      background: var(--dot, var(--sun));
      flex: 0 0 auto;
    }
    .creature-btn:hover { background: #2E2B25; }
    .creature-btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      opacity: 1 !important;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 26, 22, 0.35);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 9;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 92dvh;
      max-height: 92dvh;
      background: var(--paper);
      border-radius: 24px 24px 0 0;
      transform: translateY(102%);
      transition: transform 0.45s cubic-bezier(.2,.85,.2,1);
      z-index: 10;
      box-shadow: 0 -20px 60px rgba(28,26,22,0.3);
      display: flex;
      flex-direction: column;
      padding: 1rem 1.25rem max(1rem, env(safe-area-inset-bottom));
      will-change: transform;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: rgba(28,26,22,0.18);
      border-radius: 999px;
      margin: 0 auto 0.75rem;
      flex: 0 0 auto;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex: 0 0 auto;
    }
    .sheet-id {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--mute);
      text-transform: uppercase;
    }
    .sheet-close {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 0;
      background: rgba(28, 26, 22, 0.06);
      color: var(--ink);
      font-size: 1.1rem;
      cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.18s ease;
      flex: 0 0 auto;
    }
    .sheet-close:hover, .sheet-close:focus-visible { background: rgba(28, 26, 22, 0.12); outline: none; }

    .sheet-hero {
      margin: 0.75rem 0 1rem;
      width: 100%;
      aspect-ratio: 21 / 9;
      border-radius: 16px;
      background: radial-gradient(circle at 30% 35%, rgba(255,255,255,0.5), transparent 60%), var(--hero-color, var(--meadow));
      flex: 0 0 auto;
      overflow: hidden;
    }
    .sheet-title {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: clamp(1.8rem, 6.5vw, 2.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
      color: var(--ink);
      flex: 0 0 auto;
    }
    .sheet-role {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--pine);
      margin: 0 0 0.5rem;
      flex: 0 0 auto;
    }
    .sheet-summary {
      font-size: 0.95rem;
      color: var(--mute);
      margin: 0 0 0.85rem;
      max-width: 60ch;
      flex: 0 0 auto;
    }

    .chat {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-top: 1px solid rgba(28,26,22,0.08);
      padding-top: 0.85rem;
      gap: 0.75rem;
    }
    .conversation {
      flex: 1 1 auto;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0 0.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 92%;
      padding: 0.65rem 0.85rem;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg.bot {
      background: rgba(28, 26, 22, 0.05);
      color: var(--ink);
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }
    .msg.user {
      background: var(--ink);
      color: var(--paper);
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }
    .msg.intro {
      background: transparent;
      color: var(--mute);
      padding: 0.25rem 0.3rem;
      font-size: 0.85rem;
      font-style: italic;
      max-width: 100%;
    }
    .msg.typing {
      display: inline-flex;
      gap: 0.3rem;
      align-items: center;
      background: rgba(28, 26, 22, 0.05);
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }
    .msg.typing i {
      width: 0.35rem; height: 0.35rem;
      border-radius: 50%;
      background: var(--mute);
      animation: typing 1.1s ease-in-out infinite;
    }
    .msg.typing i:nth-child(2) { animation-delay: 0.15s; }
    .msg.typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-3px); opacity: 1; }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0 0.2rem;
      flex: 0 0 auto;
    }
    .chip {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink);
      background: rgba(28, 26, 22, 0.05);
      border: 1px solid rgba(28, 26, 22, 0.08);
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s, transform 0.18s;
      white-space: nowrap;
      min-height: 40px;
    }
    .chip::before { content: '+ '; opacity: 0.55; }
    .chip:hover, .chip:focus-visible {
      background: rgba(28, 26, 22, 0.1);
      transform: translateY(-1px);
      outline: none;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 0 0 auto;
      background: rgba(28, 26, 22, 0.05);
      border-radius: 999px;
      padding: 0.35rem 0.35rem 0.35rem 1rem;
    }
    .composer input {
      flex: 1 1 auto;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      padding: 0.5rem 0;
      outline: none;
      min-width: 0;
    }
    .composer input::placeholder { color: var(--mute); }
    .composer button {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 0;
      background: var(--ink);
      color: var(--paper);
      font-size: 1rem;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.18s ease;
      flex: 0 0 auto;
    }
    .composer button:hover { transform: scale(1.05); }

    @media (min-width: 768px) {
      .page {
        padding: max(1.5rem, env(safe-area-inset-top))
                 max(2rem, env(safe-area-inset-right))
                 max(1.5rem, env(safe-area-inset-bottom))
                 max(2rem, env(safe-area-inset-left));
      }
      .mark { font-size: 1.2rem; }
      .role-line { font-size: 0.85rem; }
      .ticker { font-size: 0.74rem; }
      .sheet {
        left: 50%;
        right: auto;
        bottom: 4vh;
        width: min(560px, 90vw);
        height: 86vh;
        transform: translateX(-50%) translateY(110%);
        border-radius: 28px;
        padding: 1.25rem 1.5rem 1.25rem;
      }
      .sheet.open { transform: translateX(-50%) translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker .eye { animation: none; }
      .msg.typing i { animation: none; }
      .sheet, .backdrop, .creature-btn, #world { transition: none !important; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .top    { animation: rise 0.7s 0.15s cubic-bezier(.2,.8,.2,1) both; }
    .bottom { animation: rise 0.7s 0.45s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .top, .bottom { animation: none; }
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>

  <script type="module">
    import * as THREE from 'three';

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const projects = JSON.parse(document.getElementById('projects-data').textContent);
    const isMobile = Math.min(innerWidth, innerHeight) < 700;

    /* ═══════════════ renderer / scene / camera ═══════════════ */
    const canvas = document.getElementById('world');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);

    const PAPER = new THREE.Color('#EFEBE0');
    const FOG_NEAR = 14, FOG_FAR = 46;
    const scene = new THREE.Scene();
    scene.background = PAPER;
    scene.fog = new THREE.Fog(PAPER, FOG_NEAR, FOG_FAR);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 90);
    const camBase = new THREE.Vector3(0, 3.4, 10.5);
    camera.position.copy(camBase);
    const lookAt = new THREE.Vector3(0, 1.8, -6);
    camera.lookAt(lookAt);

    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    const uTime = { value: 0 };
    const uPointer = { value: new THREE.Vector3(999, 0, 999) };

    /* ═══════════════ alpine terrain ═══════════════ */
    function terrainHeight(x, z) {
      // flat valley in front; ridged peaks rising behind and at the far sides
      const behind = Math.max(0, -(z + 5)) / 14;
      const sides  = Math.max(0, Math.abs(x) - 15) / 12;
      const amp = Math.min(behind * behind * 9 + sides * sides * 5, 13);
      if (amp <= 0.001) return 0;
      const r1 = Math.abs(Math.sin(x * 0.16 + 1.7) + Math.cos(z * 0.13 - 0.6));
      const r2 = Math.abs(Math.sin(x * 0.07 - 2.1) * 1.4 + Math.cos(z * 0.05 + 1.0));
      return amp * (r1 * 0.6 + r2 * 0.9) * 0.5;
    }

    const terrainGeo = new THREE.PlaneGeometry(96, 64, 150, 100);
    terrainGeo.rotateX(-Math.PI / 2);
    terrainGeo.translate(0, 0, -14); // z ∈ [-46, 18]
    {
      const pos = terrainGeo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const cMeadow = new THREE.Color('#5C7A54');
      const cMeadow2 = new THREE.Color('#4C6A46');
      const cPine = new THREE.Color('#3E5C46');
      const cGranite = new THREE.Color('#8B8680');
      const cSnow = new THREE.Color('#F4F3EE');
      const c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const h = terrainHeight(x, z);
        pos.setY(i, h);
        // color by altitude with jittered banding
        const jitter = Math.sin(x * 2.3 + z * 1.7) * 0.35;
        if (h < 0.5) {
          c.copy(cMeadow).lerp(cMeadow2, Math.min(1, Math.max(0, Math.sin(x * 0.5) * 0.5 + 0.5)));
        } else if (h < 2.6 + jitter) {
          c.copy(cMeadow2).lerp(cPine, Math.min(1, (h - 0.5) / 2.0));
        } else if (h < 5.2 + jitter) {
          c.copy(cPine).lerp(cGranite, Math.min(1, (h - 2.6) / 2.6));
        } else {
          c.copy(cGranite).lerp(cSnow, Math.min(1, (h - 5.2) / 1.6));
        }
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
      }
      terrainGeo.computeVertexNormals();
      terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    }
    // simple slope-shaded material: vertex colors darkened by normal (baked light)
    const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ vertexColors: true, fog: true, flatShading: true }));
    scene.add(terrain);
    scene.add(new THREE.AmbientLight('#FFFFFF', 0.85));
    const sunLight = new THREE.DirectionalLight('#FFF4DC', 1.1);
    sunLight.position.set(6, 12, 4);
    scene.add(sunLight);

    /* ═══════════════ glacial lake ═══════════════ */
    const LAKE = { x: 3.4, z: -3.4, rx: 4.4, rz: 2.3 };
    const lakeGeo = new THREE.CircleGeometry(1, 48);
    lakeGeo.rotateX(-Math.PI / 2);
    const lakeMat = new THREE.ShaderMaterial({
      uniforms: { uTime, fogColor: { value: PAPER }, fogNear: { value: FOG_NEAR }, fogFar: { value: FOG_FAR } },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        varying float vFogDepth;
        void main() {
          vUv = uv;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vFogDepth = -mv.z;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform vec3 fogColor;
        uniform float fogNear, fogFar;
        varying vec2 vUv;
        varying float vFogDepth;
        void main() {
          vec3 deep = vec3(0.243, 0.588, 0.573);   // glacial teal
          vec3 light = vec3(0.561, 0.847, 0.808);
          float ripple = sin(vUv.x * 34.0 + uTime * 1.3) * sin(vUv.y * 26.0 - uTime * 0.9);
          vec3 col = mix(deep, light, 0.5 + ripple * 0.25);
          // bright rim like shallow water at the shore
          float d = distance(vUv, vec2(0.5));
          col = mix(col, light, smoothstep(0.38, 0.5, d) * 0.5);
          float fogF = smoothstep(fogNear, fogFar, vFogDepth);
          gl_FragColor = vec4(mix(col, fogColor, fogF), 1.0);
        }
      `,
    });
    const lake = new THREE.Mesh(lakeGeo, lakeMat);
    lake.scale.set(LAKE.rx, 1, LAKE.rz);
    lake.position.set(LAKE.x, 0.02, LAKE.z);
    scene.add(lake);
    function inLake(x, z, pad = 1.15) {
      const dx = (x - LAKE.x) / (LAKE.rx * pad), dz = (z - LAKE.z) / (LAKE.rz * pad);
      return dx * dx + dz * dz < 1;
    }

    /* ═══════════════ meadow grass (valley only) ═══════════════ */
    const BLADES = isMobile ? 12000 : 24000;
    const bladeBase = new THREE.BufferGeometry();
    bladeBase.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      -0.035, 0, 0,   0.035, 0, 0,   0, 1, 0
    ]), 3));
    bladeBase.setAttribute('aY', new THREE.BufferAttribute(new Float32Array([0, 0, 1]), 1));

    const grassGeo = new THREE.InstancedBufferGeometry();
    grassGeo.attributes.position = bladeBase.attributes.position;
    grassGeo.attributes.aY = bladeBase.attributes.aY;

    const offsets = [], scales = [], hues = [], phases = [];
    let placed = 0;
    while (placed < BLADES) {
      const x = (Math.random() * 2 - 1) * 17;
      const z = -5.5 + Math.random() * 9.5;   // valley band
      if (inLake(x, z)) continue;
      const y = terrainHeight(x, z);
      if (y > 0.6) continue;                   // meadow stays low
      offsets.push(x, y, z);
      scales.push(0.22 + Math.random() * 0.28);
      hues.push(Math.random());
      phases.push(Math.random() * Math.PI * 2);
      placed++;
    }
    grassGeo.instanceCount = placed;
    grassGeo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(new Float32Array(offsets), 3));
    grassGeo.setAttribute('aScale',  new THREE.InstancedBufferAttribute(new Float32Array(scales), 1));
    grassGeo.setAttribute('aHue',    new THREE.InstancedBufferAttribute(new Float32Array(hues), 1));
    grassGeo.setAttribute('aPhase',  new THREE.InstancedBufferAttribute(new Float32Array(phases), 1));

    const grassMat = new THREE.ShaderMaterial({
      uniforms: { uTime, uPointer, fogColor: { value: PAPER }, fogNear: { value: FOG_NEAR }, fogFar: { value: FOG_FAR } },
      side: THREE.DoubleSide,
      vertexShader: /* glsl */`
        attribute vec3 aOffset;
        attribute float aScale, aHue, aPhase, aY;
        uniform float uTime;
        uniform vec3 uPointer;
        varying float vY, vHue, vFogDepth;
        void main() {
          vY = aY; vHue = aHue;
          vec3 p = position * aScale;
          p.y *= (1.0 + aScale);
          float sway = sin(uTime * 1.6 + aPhase + aOffset.x * 0.4) * 0.14
                     + sin(uTime * 3.7 + aPhase * 2.0) * 0.04;
          p.x += sway * aY * aY;
          vec2 d = aOffset.xz - uPointer.xz;
          float dist = length(d);
          if (dist < 1.6) {
            p.xz += normalize(d) * (1.0 - dist / 1.6) * 0.35 * aY;
          }
          vec4 mv = modelViewMatrix * vec4(p + aOffset, 1.0);
          vFogDepth = -mv.z;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: /* glsl */`
        varying float vY, vHue, vFogDepth;
        uniform vec3 fogColor;
        uniform float fogNear, fogFar;
        void main() {
          vec3 root = vec3(0.216, 0.310, 0.212);
          vec3 tipA = vec3(0.475, 0.604, 0.396);
          vec3 tipB = vec3(0.686, 0.749, 0.396);
          vec3 tip = mix(tipA, tipB, vHue);
          vec3 col = mix(root, tip, vY);
          float fogF = smoothstep(fogNear, fogFar, vFogDepth);
          gl_FragColor = vec4(mix(col, fogColor, fogF), 1.0);
        }
      `,
    });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.frustumCulled = false;
    scene.add(grass);

    /* ═══════════════ faceted ramp material ═══════════════ */
    function rampMaterial(hex, doubleSide = false) {
      const c = new THREE.Color(hex);
      const shadow = c.clone().multiplyScalar(0.5).lerp(new THREE.Color('#2E3B33'), 0.3);
      return new THREE.ShaderMaterial({
        side: doubleSide ? THREE.DoubleSide : THREE.FrontSide,
        uniforms: {
          uLit: { value: c },
          uShadow: { value: shadow },
          uRim: { value: new THREE.Color('#FFF6D8') },
          fogColor: { value: PAPER }, fogNear: { value: FOG_NEAR }, fogFar: { value: FOG_FAR },
        },
        vertexShader: /* glsl */`
          varying vec3 vN, vV;
          varying float vFogDepth;
          void main() {
            vN = normalize(normalMatrix * normal);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vV = normalize(-mv.xyz);
            vFogDepth = -mv.z;
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: /* glsl */`
          uniform vec3 uLit, uShadow, uRim, fogColor;
          uniform float fogNear, fogFar;
          varying vec3 vN, vV;
          varying float vFogDepth;
          void main() {
            vec3 L = normalize(vec3(0.5, 0.9, 0.4));
            float ndl = dot(vN, L) * 0.5 + 0.5;
            vec3 col = mix(uShadow, uLit, smoothstep(0.25, 0.85, ndl));
            float rim = pow(1.0 - max(dot(vN, vV), 0.0), 3.0);
            col += uRim * rim * 0.3;
            float fogF = smoothstep(fogNear, fogFar, vFogDepth);
            gl_FragColor = vec4(mix(col, fogColor, fogF), 1.0);
          }
        `,
      });
    }
    function faceted(geo) {
      const g = geo.toNonIndexed();
      g.computeVertexNormals();
      return g;
    }

    /* ═══════════════ alpine creatures ═══════════════ */
    function noise1(t, p) {
      return Math.sin(t * 0.7 + p) * 0.5 + Math.sin(t * 1.7 + p * 2.1) * 0.35 + Math.sin(t * 3.1 + p * 0.7) * 0.15;
    }

    class Creature {
      constructor(proj, index) {
        this.proj = proj;
        this.species = proj.species;
        this.seed = index * 137.5;
        this.group = new THREE.Group();
        this.nearPointer = 0;
        this.vx = 0; this.vz = 0;
        this.heading = Math.random() * Math.PI * 2;

        if (this.species === 'ibex') {
          this.homeX = -3.2; this.homeZ = 1.2;
          this.range = { x: [-5.5, -0.8], z: [0.2, 2.8] };
          this.labelY = 0;
        } else if (this.species === 'marmot') {
          this.homeX = 2.0; this.homeZ = 2.0;
          this.range = { x: [0.8, 4.6], z: [1.0, 3.2] };
          this.labelY = 0;
        } else { // flock
          this.homeX = LAKE.x; this.homeZ = LAKE.z;
          this.range = { x: [LAKE.x - 1.6, LAKE.x + 1.6], z: [LAKE.z - 1.2, LAKE.z + 1.2] };
          this.labelY = 1.4;
        }
        this.x = this.homeX; this.z = this.homeZ;
        this.build();
        scene.add(this.group);
      }

      build() {
        if (this.species === 'ibex') this.buildIbex();
        else if (this.species === 'marmot') this.buildMarmot();
        else this.buildFlock();

        this.proxy = new THREE.Mesh(
          new THREE.SphereGeometry(this.species === 'flock' ? 1.6 : 1.0, 8, 6),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        this.proxy.userData.creature = this;
        this.proxy.position.y = this.species === 'flock' ? 0 : 0.5;
        this.group.add(this.proxy);
      }

      buildIbex() {
        const fur = rampMaterial('#B08D5E');
        const dark = rampMaterial('#6E5638');
        // body
        const body = new THREE.Mesh(faceted(new THREE.SphereGeometry(0.34, 7, 5)), fur);
        body.scale.set(1.5, 1.0, 0.8);
        body.position.y = 0.62;
        this.group.add(body);
        // neck + head
        const head = new THREE.Mesh(faceted(new THREE.SphereGeometry(0.16, 6, 5)), fur);
        head.position.set(0.52, 0.98, 0);
        this.group.add(head);
        const snout = new THREE.Mesh(faceted(new THREE.ConeGeometry(0.09, 0.22, 5)), dark);
        snout.rotation.z = -Math.PI / 2;
        snout.position.set(0.68, 0.94, 0);
        this.group.add(snout);
        // the horns — the ibex signature, big curved arcs
        for (const side of [-1, 1]) {
          const horn = new THREE.Mesh(
            faceted(new THREE.TorusGeometry(0.26, 0.035, 5, 10, Math.PI * 0.85)),
            dark
          );
          horn.position.set(0.46, 1.06, side * 0.07);
          horn.rotation.set(side * 0.15, 0, Math.PI * 0.7);
          this.group.add(horn);
        }
        // legs
        const legGeo = faceted(new THREE.CylinderGeometry(0.04, 0.035, 0.6, 5));
        for (const [lx, lz] of [[-0.32, -0.16], [-0.32, 0.16], [0.34, -0.16], [0.34, 0.16]]) {
          const leg = new THREE.Mesh(legGeo, dark);
          leg.position.set(lx, 0.3, lz);
          this.group.add(leg);
        }
        this.body = body;
      }

      buildMarmot() {
        const fur = rampMaterial('#A98A6A');
        const belly = rampMaterial('#C9AE8C');
        this.sitGroup = new THREE.Group();
        const body = new THREE.Mesh(faceted(new THREE.SphereGeometry(0.3, 7, 5)), fur);
        body.scale.set(1.2, 0.85, 0.95);
        body.position.y = 0.28;
        this.sitGroup.add(body);
        const chest = new THREE.Mesh(faceted(new THREE.SphereGeometry(0.18, 6, 5)), belly);
        chest.position.set(0.22, 0.3, 0);
        this.sitGroup.add(chest);
        const head = new THREE.Mesh(faceted(new THREE.SphereGeometry(0.15, 6, 5)), fur);
        head.position.set(0.32, 0.55, 0);
        this.sitGroup.add(head);
        for (const side of [-1, 1]) {
          const ear = new THREE.Mesh(faceted(new THREE.SphereGeometry(0.045, 5, 4)), fur);
          ear.position.set(0.28, 0.68, side * 0.09);
          this.sitGroup.add(ear);
        }
        this.group.add(this.sitGroup);
        this.body = body;
        this.sitPhase = Math.random() * 10;
      }

      buildFlock() {
        // alpine choughs: black birds, yellow beaks, circling as one community
        this.birds = [];
        const feathers = rampMaterial('#26231F', true);
        const beakMat = rampMaterial('#E8B94C');
        for (let i = 0; i < 6; i++) {
          const bird = new THREE.Group();
          const body = new THREE.Mesh(faceted(new THREE.ConeGeometry(0.07, 0.3, 5)), feathers);
          body.rotation.z = -Math.PI / 2;
          bird.add(body);
          const beak = new THREE.Mesh(faceted(new THREE.ConeGeometry(0.03, 0.09, 4)), beakMat);
          beak.rotation.z = -Math.PI / 2;
          beak.position.x = 0.19;
          bird.add(beak);
          const wingGeo = new THREE.PlaneGeometry(0.34, 0.14);
          wingGeo.translate(0.17, 0, 0);
          const wings = [];
          for (const side of [-1, 1]) {
            const w = new THREE.Mesh(wingGeo, feathers);
            w.rotation.y = side > 0 ? 0 : Math.PI;
            w.rotation.x = Math.PI / 2;
            bird.add(w);
            wings.push(w);
          }
          bird.userData = { phase: (i / 6) * Math.PI * 2, r: 1.1 + (i % 3) * 0.35, wings, h: 2.6 + (i % 3) * 0.4 };
          this.group.add(bird);
          this.birds.push(bird);
        }
      }

      update(t, dt) {
        const s = this.seed;
        const speedBase = this.species === 'flock' ? 0.4 : this.species === 'ibex' ? 0.25 : 0.3;

        this.heading += noise1(t * 0.35, s) * 0.7 * dt;
        this.vx += (this.homeX - this.x) * 0.1 * dt;
        this.vz += (this.homeZ - this.z) * 0.1 * dt;

        const dp = Math.hypot(uPointer.value.x - this.x, uPointer.value.z - this.z);
        const near = dp < 2.5 ? 1 - dp / 2.5 : 0;
        this.nearPointer += (near - this.nearPointer) * (1 - Math.exp(-5 * dt));
        const speed = speedBase * (1 - this.nearPointer * 0.6);

        this.vx += Math.cos(this.heading) * speed * dt;
        this.vz += Math.sin(this.heading) * speed * dt;
        this.vx *= Math.exp(-1.4 * dt);
        this.vz *= Math.exp(-1.4 * dt);
        this.x = Math.max(this.range.x[0], Math.min(this.range.x[1], this.x + this.vx));
        this.z = Math.max(this.range.z[0], Math.min(this.range.z[1], this.z + this.vz));

        const groundY = this.species === 'flock' ? 0 : terrainHeight(this.x, this.z);

        if (this.species === 'ibex') {
          const bob = Math.abs(Math.sin(t * 2.2 + s)) * 0.03;
          this.group.position.set(this.x, groundY + bob, this.z);
          const targetRot = Math.atan2(-Math.sin(this.heading), Math.cos(this.heading));
          this.group.rotation.y += (targetRot - this.group.rotation.y) * (1 - Math.exp(-2 * dt));
        } else if (this.species === 'marmot') {
          // periodically sits up tall (the whistle pose)
          const sit = Math.max(0, Math.sin(t * 0.5 + this.sitPhase)) ** 3;
          this.sitGroup.rotation.z = sit * 0.9;
          this.sitGroup.position.y = sit * 0.12;
          this.group.position.set(this.x, groundY, this.z);
          const targetRot = Math.atan2(-Math.sin(this.heading), Math.cos(this.heading));
          this.group.rotation.y += (targetRot - this.group.rotation.y) * (1 - Math.exp(-2 * dt));
        } else {
          this.group.position.set(this.x, 0, this.z);
          for (const bird of this.birds) {
            const u = bird.userData;
            const a = t * 0.7 + u.phase;
            bird.position.set(
              Math.cos(a) * u.r,
              u.h + Math.sin(t * 1.3 + u.phase) * 0.25,
              Math.sin(a) * u.r * 0.6
            );
            bird.rotation.y = -a + Math.PI / 2;
            const flap = Math.sin(t * (reduce ? 2 : 11) + u.phase) * 0.7;
            u.wings[0].rotation.z = flap * 0.5;
            u.wings[1].rotation.z = -flap * 0.5;
          }
          this.proxy.position.y = 2.8;
        }
      }
    }

    const creatures = projects.map((p, i) => new Creature(p, i));

    /* ═══════════════ neon survey markers (the one artificial note) ═══════════════ */
    const wireMat = new THREE.LineBasicMaterial({ color: '#47E0D6', transparent: true, opacity: 0.85 });
    const wires = [];
    const wirePositions = [[-6.5, 2.2, -6], [8.5, 3.0, -9]];
    for (let i = 0; i < 2; i++) {
      const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.5, 0.5, 0.5)), wireMat);
      box.position.set(...wirePositions[i]);
      scene.add(box);
      wires.push(box);
    }

    /* ═══════════════ drifting motes ═══════════════ */
    const MOTES = 80;
    const motePos = new Float32Array(MOTES * 3);
    for (let i = 0; i < MOTES; i++) {
      motePos[i * 3] = (Math.random() - 0.5) * 24;
      motePos[i * 3 + 1] = Math.random() * 5;
      motePos[i * 3 + 2] = -8 + (Math.random() - 0.5) * 16;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
      color: '#FFF6D8', size: 0.05, transparent: true, opacity: 0.7, fog: true,
    }));
    scene.add(motes);

    /* ═══════════════ pointer → world ═══════════════ */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hit = new THREE.Vector3();
    const pointerTarget = new THREE.Vector3(999, 0, 999);
    const parallax = { x: 0, y: 0 };

    function updatePointer(clientX, clientY) {
      ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(groundPlane, hit)) pointerTarget.copy(hit);
      parallax.x = ndc.x;
      parallax.y = ndc.y;
    }
    addEventListener('pointermove', e => updatePointer(e.clientX, e.clientY), { passive: true });

    addEventListener('pointerdown', e => {
      if (e.target.closest('button, a, input, .sheet, .backdrop')) return;
      updatePointer(e.clientX, e.clientY);
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(creatures.map(c => c.proxy));
      if (hits.length) openSheet(hits[0].object.userData.creature.proj);
    });

    /* ═══════════════ creature labels ═══════════════ */
    const buttons = creatures.map(c => {
      const b = document.createElement('button');
      b.className = 'creature-btn';
      b.style.setProperty('--dot', c.proj.color);
      b.innerHTML = `<span class="dot"></span>${c.proj.label} · talk`;
      b.setAttribute('aria-label', `Open project: ${c.proj.label}`);
      b.addEventListener('click', () => openSheet(c.proj));
      document.body.appendChild(b);
      return b;
    });
    const _v = new THREE.Vector3();
    function updateButtons() {
      creatures.forEach((c, i) => {
        _v.set(c.x, c.labelY, c.z).project(camera);
        const sx = Math.max(90, Math.min(innerWidth - 90, (_v.x * 0.5 + 0.5) * innerWidth));
        const sy = (-_v.y * 0.5 + 0.5) * innerHeight;
        const b = buttons[i];
        b.style.left = sx + 'px';
        b.style.top = (sy + 10) + 'px';
        b.style.opacity = _v.z < 1 ? (0.78 + c.nearPointer * 0.22) : 0;
      });
    }

    /* ═══════════════ ambient ticker ═══════════════ */
    const tickerText = document.getElementById('tickerText');
    const ticker = document.getElementById('ticker');
    const verbs = {
      ibex:   ['is surveying the ridge', 'is standing very still', 'found the highest rock'],
      marmot: ['just whistled', 'is sunning itself', 'popped out of its burrow'],
      flock:  ['are circling the lake', 'are riding the updraft', 'are gathering'],
    };
    function tickerMessage() {
      const c = creatures[Math.floor(Math.random() * creatures.length)];
      const v = verbs[c.species] || verbs.ibex;
      const verb = v[Math.floor(Math.random() * v.length)];
      const topics = c.proj.topics || [];
      const topic = topics[Math.floor(Math.random() * topics.length)];
      const subject = c.species === 'flock' ? 'the choughs' : c.species === 'ibex' ? 'the ibex' : 'the marmot';
      return `${subject} ${verb} · ask about ${topic ? topic.label : c.proj.label}`;
    }
    setInterval(() => {
      ticker.classList.add('swap');
      setTimeout(() => {
        tickerText.textContent = tickerMessage();
        ticker.classList.remove('swap');
      }, 500);
    }, 5000);
    setTimeout(() => { tickerText.textContent = tickerMessage(); }, 2200);

    /* ═══════════════ main loop ═══════════════ */
    let last = performance.now();
    let running = true;
    let revealed = false;

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (!reduce) uTime.value = now / 1000;
      const t = uTime.value;

      uPointer.value.lerp(pointerTarget, 1 - Math.exp(-8 * dt));

      camera.position.x += (camBase.x + parallax.x * 0.7 - camera.position.x) * (1 - Math.exp(-3 * dt));
      camera.position.y += (camBase.y - parallax.y * 0.35 - camera.position.y) * (1 - Math.exp(-3 * dt));
      camera.lookAt(lookAt);

      for (const c of creatures) c.update(t, dt);

      wires.forEach((w, i) => {
        w.rotation.x = t * 0.3 * (i ? 1 : -1);
        w.rotation.y = t * 0.4;
      });
      motes.rotation.y = t * 0.008;

      renderer.render(scene, camera);
      updateButtons();

      if (!revealed) {
        revealed = true;
        canvas.classList.add('ready');
      }
      if (running && !reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    if (reduce) {
      uTime.value = 4;
      setTimeout(() => frame(performance.now()), 100);
    }

    document.addEventListener('visibilitychange', () => {
      running = !document.hidden;
      if (running && !reduce) { last = performance.now(); requestAnimationFrame(frame); }
    });

    /* ═══════════════ sheet + chat ═══════════════ */
    const sheet = document.getElementById('sheet');
    const backdrop = document.getElementById('backdrop');
    const sheetId = document.getElementById('sheetId');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetRole = document.getElementById('sheetRole');
    const sheetSummary = document.getElementById('sheetSummary');
    const sheetHero = document.getElementById('sheetHero');
    const sheetClose = document.getElementById('sheetClose');
    const conv = document.getElementById('conv');
    const chipsEl = document.getElementById('chips');
    const composer = document.getElementById('composer');
    const composerInput = document.getElementById('composerInput');

    let activeProject = null;
    let askedTopicIds = new Set();
    let lastFocused = null;
    const conversations = new Map();

    function openSheet(proj) {
      activeProject = proj;
      lastFocused = document.activeElement;
      askedTopicIds = (conversations.get(proj.id)?.asked) || new Set();

      sheetId.textContent = proj.label;
      sheetTitle.textContent = proj.label;
      sheetRole.textContent = proj.role || '';
      sheetSummary.textContent = proj.summary || '';
      sheetHero.style.setProperty('--hero-color', proj.color || 'var(--meadow)');

      conv.innerHTML = '';
      const existing = conversations.get(proj.id);
      if (existing && existing.messages.length) {
        existing.messages.forEach(m => appendMsg(m.role, m.text, false));
      } else {
        appendMsg('intro', 'ask anything about this project — or pick a topic.', false);
        conversations.set(proj.id, { messages: [{ role: 'intro', text: 'ask anything about this project — or pick a topic.' }], asked: new Set() });
        askedTopicIds = conversations.get(proj.id).asked;
      }
      renderChips(suggestedTopics(proj));
      composerInput.value = '';

      backdrop.classList.add('open');
      sheet.classList.add('open');
      backdrop.setAttribute('aria-hidden', 'false');
      setTimeout(() => sheet.focus({ preventScroll: true }), 380);
    }

    function closeSheet() {
      sheet.classList.remove('open');
      backdrop.classList.remove('open');
      backdrop.setAttribute('aria-hidden', 'true');
      activeProject = null;
      if (lastFocused && lastFocused.focus) lastFocused.focus({ preventScroll: true });
    }
    sheetClose.addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);
    addEventListener('keydown', e => {
      if (!sheet.classList.contains('open')) return;
      if (e.key === 'Escape') { closeSheet(); return; }
      if (e.key === 'Tab') {
        const focusables = sheet.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])');
        if (!focusables.length) return;
        const first = focusables[0], lastF = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastF.focus(); }
        else if (!e.shiftKey && document.activeElement === lastF) { e.preventDefault(); first.focus(); }
      }
    });

    function appendMsg(role, text, save = true) {
      const li = document.createElement('li');
      li.className = 'msg ' + role;
      li.textContent = text;
      conv.appendChild(li);
      conv.scrollTop = conv.scrollHeight;
      if (save && activeProject) conversations.get(activeProject.id).messages.push({ role, text });
      return li;
    }

    function showTyping() {
      const li = document.createElement('li');
      li.className = 'msg typing';
      li.innerHTML = '<i></i><i></i><i></i>';
      li.setAttribute('aria-hidden', 'true');
      conv.appendChild(li);
      conv.scrollTop = conv.scrollHeight;
      return li;
    }

    function suggestedTopics(proj, fromTopic = null) {
      const topics = proj.topics || [];
      let pool;
      if (fromTopic && fromTopic.related?.length) {
        pool = fromTopic.related.map(id => topics.find(t => t.id === id)).filter(Boolean);
      } else {
        pool = topics.slice();
      }
      const unasked = pool.filter(t => !askedTopicIds.has(t.id));
      return (unasked.length ? unasked : pool).slice(0, 5);
    }

    function renderChips(topics) {
      chipsEl.innerHTML = '';
      topics.forEach(t => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = t.label;
        b.addEventListener('click', () => askTopic(t));
        chipsEl.appendChild(b);
      });
    }

    function reply(topic) {
      const typing = showTyping();
      setTimeout(() => {
        typing.remove();
        appendMsg('bot', topic.answer);
        renderChips(suggestedTopics(activeProject, topic));
      }, 550 + Math.random() * 350);
    }

    function askTopic(topic) {
      if (!activeProject) return;
      appendMsg('user', topic.label);
      askedTopicIds.add(topic.id);
      reply(topic);
    }

    /* keyword matcher — swap for a real LLM endpoint later */
    function findBestTopic(query, proj) {
      const tokens = (query || '').toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(w => w.length > 2);
      if (!tokens.length) return null;
      let best = null, bestScore = 0;
      for (const t of proj.topics) {
        const target = (t.label + ' ' + (t.answer || '')).toLowerCase();
        const score = tokens.filter(tok => target.includes(tok)).length / tokens.length;
        if (score > bestScore) { best = t; bestScore = score; }
      }
      return bestScore >= 0.34 ? best : null;
    }

    composer.addEventListener('submit', e => {
      e.preventDefault();
      const q = composerInput.value.trim();
      if (!q || !activeProject) return;
      composerInput.value = '';
      appendMsg('user', q);
      const match = findBestTopic(q, activeProject);
      const typing = showTyping();
      setTimeout(() => {
        typing.remove();
        if (match) {
          askedTopicIds.add(match.id);
          appendMsg('bot', match.answer);
          renderChips(suggestedTopics(activeProject, match));
        } else {
          appendMsg('bot', "I don't have an answer for that yet — try one of these:");
          renderChips(suggestedTopics(activeProject));
        }
      }, 600 + Math.random() * 400);
    });
  </script>
</body>
</html>
